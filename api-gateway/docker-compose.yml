services:
  gateway:
    build: .
    container_name: ticketu-api-gateway
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - plataforma-eventos-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  plataforma-eventos-net:
    external: true
